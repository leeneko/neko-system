<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ title }} - 읽기</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- use global stylesheet (do not override) -->
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Minimal, non-invasive styles for toolbar / toast only.
       Avoid overriding global typography or theme variables. */
    .reader-toolbar { display:flex; gap:12px; margin:10px 0 14px; flex-wrap:wrap; align-items:center; }
    .reader-toolbar .group { display:flex; gap:8px; align-items:center; }
    .reader-toolbar .btn { padding:6px 10px; border-radius:4px; cursor:pointer; }
    .font-select { padding:6px; }
    .content-area { /* do not force font-family; defer to global CSS */ font-size:16px; line-height:1.8; }
    #toast {
      visibility: hidden;
      min-width: 200px;
      margin-left: -100px;
      background-color: rgba(0,0,0,0.85);
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 10px 14px;
      position: fixed;
      z-index: 10000;
      left: 50%;
      bottom: 30px;
      font-size: 14px;
      opacity: 0;
      transition: opacity .2s ease-in-out, visibility 0s linear .2s;
    }
    #toast.show {
      visibility: visible;
      opacity: 1;
      transition-delay: 0s;
    }
  </style>
</head>
<body class="{{ theme }}">
  <div class="container">
    <!-- Toolbar: uses global visual tokens from style.css -->
    <div class="reader-toolbar" role="toolbar" aria-label="reader controls">
      <div class="group" id="nav-group">
        <a class="btn" href="/web/novel/{{ novel_id }}">목록</a>
        {% if next_chapter_id %}
          <a class="btn" id="next-top" href="/web/read/{{ next_chapter_id }}?view={{ view_mode }}">다음</a>
        {% else %}
          <a class="btn" id="next-top" href="javascript:void(0)" data-no-next="1">다음</a>
        {% endif %}
      </div>

      <div class="group" id="view-group">
        <label for="font-select" style="font-size:13px;color:inherit;margin-right:6px;">글꼴</label>
        <select id="font-select" class="font-select">
          <option value="">기본</option>
          <option value="Noto Serif KR, serif">명조 계열</option>
          <option value="'Malgun Gothic', '맑은 고딕', Arial">맑은고딕</option>
          <option value="Courier New, monospace">등폭(코드)</option>
        </select>
        <button id="spacing-toggle" class="btn">간격 보정</button>
      </div>

      <div class="group" id="action-group">
        <a id="download-btn" class="btn" href="/client/read/{{ chapter_id }}?download=1">다운로드</a>
      </div>
    </div>

    <h1>{{ title }}</h1>

    <div id="content" class="content-area">
      {{ content | safe }}
    </div>

    {% if translated_content %}
    <hr>
    <h3>번역</h3>
    <div id="translated" class="content-area">
      {{ translated_content | safe }}
    </div>
    {% endif %}

    <div class="nav-buttons" style="margin-top:14px;">
      {% if next_chapter_id %}
        <a id="next-btn" class="btn" href="/web/read/{{ next_chapter_id }}?view={{ view_mode }}">다음</a>
      {% else %}
        <a id="next-btn" class="btn" href="javascript:void(0)" data-no-next="1">다음</a>
      {% endif %}
      <a id="list-btn" class="btn" href="/web/novel/{{ novel_id }}">목록</a>
    </div>
  </div>

  <div id="toast">마지막 화입니다. 회차 목록으로 이동합니다.</div>

  <script>
  (function(){
    // font selection: apply inline style only to content area (non-invasive)
    const fontSelect = document.getElementById('font-select');
    const content = document.getElementById('content');
    function applyFont(f){
      if(!content) return;
      if(!f) {
        content.style.fontFamily = '';
      } else {
        content.style.fontFamily = f;
      }
      try { localStorage.setItem('reader_font', f || ''); } catch(e){}
    }
    fontSelect.addEventListener('change', ()=> applyFont(fontSelect.value));
    const savedFont = (function(){ try{ return localStorage.getItem('reader_font'); }catch(e){return null;} })();
    if(savedFont){
      fontSelect.value = savedFont;
      applyFont(savedFont);
    }

    // spacing toggle uses existing server param behavior
    const spacingBtn = document.getElementById('spacing-toggle');
    spacingBtn.addEventListener('click', ()=>{
      const params = new URLSearchParams(window.location.search);
      const current = params.get('spacing') === '1';
      if(current) params.delete('spacing'); else params.set('spacing','1');
      window.location.search = params.toString();
    });

    // Next button toast behavior (both top and bottom)
    function attachNext(btn){
      if(!btn) return;
      btn.addEventListener('click', function(e){
        if(btn.getAttribute('data-no-next') === '1'){
          e.preventDefault();
          const toast = document.getElementById('toast');
          if(toast){ toast.classList.add('show'); }
          setTimeout(function(){
            if(toast){ toast.classList.remove('show'); }
            window.location.href = '/web/novel/{{ novel_id }}';
          }, 1200);
        }
      });
    }
    attachNext(document.getElementById('next-top'));
    attachNext(document.getElementById('next-btn'));
  })();
  </script>
</body>
</html>
