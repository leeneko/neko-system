<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소설 요청</title>
    <link rel="stylesheet" href="/common.css">
</head>
<body data-theme="{{ theme }}">
    <div class="wrap">
        <header>
            <a class="brand" href="/web">
                <h1>소설 요청</h1>
                <span class="worker-dot {% if worker_ok %}ok{% endif %}" title="워커 상태"></span>
            </a>
            <div class="actions">
                <a class="btn" href="/web">책장</a>
                <a class="btn" href="/web/runtime">실시간 현황</a>
                <div class="theme">
                    <a class="btn theme-btn {% if theme == 'paper' %}active{% endif %}" href="/web/theme/paper?next={{ request.url.path }}">Paper</a>
                    <a class="btn theme-btn {% if theme == 'dark' %}active{% endif %}" href="/web/theme/dark?next={{ request.url.path }}">Dark</a>
                    <a class="btn theme-btn {% if theme == 'light' %}active{% endif %}" href="/web/theme/light?next={{ request.url.path }}">Light</a>
                </div>
            </div>
        </header>

        <div class="panel">
            <div class="tabs" role="tablist" aria-label="사이트 선택">
                <button class="tab active" type="button" data-site="booktoki" role="tab" aria-selected="true">북토끼</button>
                <button class="tab" type="button" data-site="syosetu" role="tab" aria-selected="false">소설가가되자</button>
            </div>

            <form method="post" action="/web/request">
                <label for="title">소설 제목</label>
                <input id="title" name="title" required placeholder="예: 테스트소설" />

                <label for="url">소설 URL</label>
                <input id="url" name="url" required placeholder="예: https://booktoki469.com/novel/20661854" />
                <label>장르 선택 (최대 3개)</label>
                <div class="genre-options">
                    {% for g in all_genres %}
                        <label>
                            <input type="checkbox" name="genres" value="{{ g }}">
                            {{ g }}
                        </label>
                    {% endfor %}
                </div>
                <label for="custom_genres">장르 직접 입력 (쉼표로 구분)</label>
                <input id="custom_genres" name="custom_genres" placeholder="예: 로맨스, 성장, 힐링" />
                <div id="siteHint" class="hint">지원 사이트: 북토끼</div>
                <div id="exampleHint" class="hint">예시: 제목 `테스트소설`, URL `https://booktoki469.com/novel/20661854`</div>
                <div class="hint">요청 후 자동으로 다음 화 여부를 확인합니다.</div>

                <button class="submit" type="submit">요청 보내기</button>
            </form>

            {% if status %}
                <div class="status {{ status.type }}">{{ status.msg }}</div>
            {% endif %}
        </div>
    </div>

    <script>
        (function () {
            var tabs = document.querySelectorAll(".tab");
            var urlInput = document.getElementById("url");
            var siteHint = document.getElementById("siteHint");
            var exampleHint = document.getElementById("exampleHint");

            function setActive(site) {
                tabs.forEach(function (t) {
                    var isActive = t.getAttribute("data-site") === site;
                    t.classList.toggle("active", isActive);
                    t.setAttribute("aria-selected", isActive ? "true" : "false");
                });

                if (site === "syosetu") {
                    urlInput.placeholder = "예: https://ncode.syosetu.com/n3289ds/1/";
                    siteHint.textContent = "지원 사이트: 소설가가되자";
                    exampleHint.textContent = "예시: 제목 `테스트소설`, URL `https://ncode.syosetu.com/n3289ds/1/`";
                } else {
                    urlInput.placeholder = "예: https://booktoki469.com/novel/20661854";
                    siteHint.textContent = "지원 사이트: 북토끼";
                    exampleHint.textContent = "예시: 제목 `테스트소설`, URL `https://booktoki469.com/novel/20661854`";
                }
            }

            tabs.forEach(function (t) {
                t.addEventListener("click", function () {
                    setActive(t.getAttribute("data-site"));
                });
            });

            setActive("booktoki");
        })();
    </script>
</body>
</html>
