name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      ENABLE_TRANSLATION: '1'
      TRANSLATION_DEVICE: 'cpu'
      PYTHON_VERSION: '3.9'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies (if any)
        run: |
          py -m pip install --upgrade pip
        shell: cmd

      - name: Install worker requirements
        run: |
          pushd rabbit-system\worker
          py -m pip install -r requirements.txt
          popd
        shell: cmd

      - name: Install CPU PyTorch and transformers (translation)
        run: |
          pushd rabbit-system\worker
          py -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          py -m pip install transformers sentencepiece
          popd
        shell: cmd

      - name: Install PyInstaller
        run: |
          pushd rabbit-system\worker
          py -m pip install pyinstaller
          popd
        shell: cmd

      - name: Build RabbitWorker.exe (run build.bat)
        env:
          ENABLE_TRANSLATION: ${{ env.ENABLE_TRANSLATION }}
        run: |
          pushd rabbit-system\worker
          call build.bat
          popd
        shell: cmd

      - name: Upload exe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RabbitWorker
          path: rabbit-system/worker/dist/RabbitWorker.exe

      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RabbitWorker-artifacts
          path: |
            rabbit-system/worker/dist/**
            rabbit-system/worker/worker_error.log