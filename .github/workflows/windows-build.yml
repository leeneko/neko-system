name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      ENABLE_TRANSLATION: '1'
      TRANSLATION_DEVICE: 'cpu'
      PYTHON_VERSION: '3.9'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies (if any)
        run: |
          py -m pip install --upgrade pip
        shell: cmd

      - name: Show worker folder before install (diagnostic)
        run: |
          dir /b
          if exist worker (
            dir worker /a
          ) else (
            echo "worker folder not found"
          )
        shell: cmd

      - name: Install worker requirements
        run: |
          pushd worker
          py -m pip install -r requirements.txt > pip_install_req.txt 2>&1 || set REQEXIT=%ERRORLEVEL%
          type pip_install_req.txt
          popd
          if defined REQEXIT exit /b %REQEXIT%
        shell: cmd

      - name: Install CPU PyTorch and transformers (translation)
        run: |
          pushd worker
          py -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu > pip_install_torch.txt 2>&1 || set TORCHEXIT=%ERRORLEVEL%
          py -m pip install transformers sentencepiece >> pip_install_torch.txt 2>&1 || set TORCHEXIT=%ERRORLEVEL%
          type pip_install_torch.txt
          popd
          if defined TORCHEXIT exit /b %TORCHEXIT%
        shell: cmd

      - name: Install PyInstaller
        run: |
          pushd worker
          py -m pip install pyinstaller > pip_install_pyinstaller.txt 2>&1 || set PYINSEXIT=%ERRORLEVEL%
          type pip_install_pyinstaller.txt
          popd
          if defined PYINSEXIT exit /b %PYINSEXIT%
        shell: cmd

      - name: Build RabbitWorker.exe (capture output)
        env:
          ENABLE_TRANSLATION: ${{ env.ENABLE_TRANSLATION }}
        run: |
          pushd worker
          call build.bat > build_output.txt 2>&1 || set BUILDEXIT=%ERRORLEVEL%
          type build_output.txt
          echo ==== DIST LIST ====
          if exist dist (
            dir dist /s /b
          ) else (
            echo "dist folder not found"
          )
          popd
          if defined BUILDEXIT exit /b %BUILDEXIT%
        shell: cmd

      - name: Upload exe artifact (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RabbitWorker
          path: worker/dist/RabbitWorker.exe
          if-no-files-found: warn

      - name: Upload build logs and diagnostics (always, warn if missing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RabbitWorker-build-logs-and-artifacts
          path: |
            worker/build_output.txt
            worker/pip_install_req.txt
            worker/pip_install_torch.txt
            worker/pip_install_pyinstaller.txt
            worker/worker_error.log
            worker/dist/**
          if-no-files-found: warn